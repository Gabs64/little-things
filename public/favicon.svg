<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradMatcha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d59d"/>
      <stop offset="100%" stop-color="#6b9b5a"/>
    </linearGradient>
    <linearGradient id="gradStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#ede8f8" stroke="#d5c8ed" stroke-width="2"/>
  
  <!-- Matcha Cup -->
  <path d="M16 28 C16 42 22 48 32 48 C42 48 48 42 48 28 Z" fill="url(#gradMatcha)" />
  <!-- Cup Rim -->
  <ellipse cx="32" cy="28" rx="16" ry="4" fill="#88b879" />
  <ellipse cx="32" cy="27" rx="14" ry="3" fill="#c4e8b7" />
  <!-- Cup Handle -->
  <path d="M46 32 C52 32 52 40 46 42" fill="none" stroke="#6b9b5a" stroke-width="3" stroke-linecap="round" />
  <!-- Steam curls -->
  <path d="M28 22 Q30 18 28 15 Q26 12 28 9" fill="none" stroke="#c4b5e8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M36 22 Q34 18 36 15 Q38 12 36 9" fill="none" stroke="#c4b5e8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Little Star badge -->
  <polygon points="46,14 48,19 54,20 49,24 51,30 46,26 41,30 43,24 38,20 44,19" fill="url(#gradStar)" filter="url(#glow)"/>
</svg>